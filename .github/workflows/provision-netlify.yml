name: Provision Netlify site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Credential diagnostic
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >-
          curl --silent --output /dev/null --write-out '%{http_code}
'
          --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          https://api.netlify.com/api/v1/sites
      - name: Stop unless diagnostic succeeded
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >-
          test "$(curl --silent --output /dev/null --write-out '%{http_code}'
          --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          https://api.netlify.com/api/v1/sites)" = "200"
      - name: Create site
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          site_id=$(curl --fail --silent --show-error --request POST --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" --header "Content-Type: application/json" --data '{"name":"blacks-rep-tool-v1","account_slug":"craigmcgeown1"}' https://api.netlify.com/api/v1/sites | jq -r .id)
          test -n "$site_id"
          echo "site_id=$site_id" >> "$GITHUB_OUTPUT"
          echo "NETLIFY_SITE_ID=$site_id"
      - name: Report site ID
        run: echo "${{ steps.site.outputs.site_id }}"
